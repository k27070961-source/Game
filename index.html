<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      background: #1e1e1e;
      color: white;
      text-align: center;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>✅ Всё работает!</h1>
  <p id="info">Загрузка данных...</p>
  <button onclick="document.getElementById('info').innerText = 'Кнопка нажата!'">
    Нажми меня
  </button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    try {
      const user = tg.initDataUnsafe.user;
      if (user) {
        document.getElementById('info').innerText =
          'Привет, ' + user.first_name + '!';
      } else {
        document.getElementById('info').innerText =
          'Открыто не из Telegram (или данные не переданы)';
      }
    } catch (e) {
      document.getElementById('info').innerText = 'Открыто в обычном браузере';
    }
  </script>
</body>
</html>
